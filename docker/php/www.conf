[payroll_adjustments_www]

user = www-data
group = www-data

listen = 127.0.0.1:9200

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 30

env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

;access.log = /var/log/$pool-fpm-access.log
;access.format = %R - %p - %P - %u %t "%m %r %Q %q" %s %f Time:%{seconds}d Mem:%{mega}M Cpu:%C%%

;php_flag[display_errors] = off
php_admin_value[error_log] = /var/log/fpm-php.payroll_adjustments_www.log
;php_admin_flag[log_errors] = on
;php_admin_value[memory_limit] = 256M
